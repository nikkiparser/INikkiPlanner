<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inikki Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2b1b3d; --ink-soft:#6d5a80; --paper:#fbf3f7; --card:#ffffff;
  --rose:#b83a68; --rose-dark:#962c53; --lilac:#ece4f7; --line:#e6d8ea; --gold:#a97c14;
  --serif:"Fraunces",Georgia,"Times New Roman",serif;
  --sans:"Nunito Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--ink:#f3e9f8; --ink-soft:#b9a6cc; --paper:#1d1428; --card:#2a1d3a; --lilac:#382850; --line:#453360; --rose:#f08bb0; --rose-dark:#ffb3cd; --gold:#e8c065}
}
*{box-sizing:border-box}
html{scroll-padding-top:5rem}
body{margin:0;background:var(--paper);color:var(--ink);font:400 1rem/1.55 var(--sans)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--rose);outline-offset:2px}

/* top bar */
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.75rem clamp(1rem,4vw,2.5rem);background:var(--paper);border-bottom:1px solid var(--line)}
.bar h1{margin:0;font:700 1.5rem/1 var(--serif);letter-spacing:-.01em}
.cart-btn{display:flex;align-items:center;gap:.6rem;padding:.55rem 1rem;border:0;border-radius:999px;background:var(--rose);color:#fff;font-weight:700}
.cart-btn:hover{background:var(--rose-dark)}
.cart-btn .count{min-width:1.5rem;padding:0 .4rem;border-radius:999px;background:#fff;color:var(--rose-dark);text-align:center;font-size:.85rem;line-height:1.5rem}

/* collection tabs */
.tabs{display:flex;gap:.4rem;overflow-x:auto;padding:1rem clamp(1rem,4vw,2.5rem) .5rem;scrollbar-width:thin}
.tab{flex:none;padding:.45rem 1rem;border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--ink-soft);font-weight:600}
.tab[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}

main{padding:1rem clamp(1rem,4vw,2.5rem) 4rem;max-width:1200px;margin:0 auto}
h2.sub{margin:2rem 0 1rem;font:700 1.4rem/1.2 var(--serif)}
.empty{margin:0;color:var(--ink-soft);font-style:italic}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:1.25rem}

/* pack wrapper */
.pack{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.pack-head{padding:1rem 1.1rem;background:var(--lilac)}
.pack-head h3{margin:0;font:700 1.25rem/1.2 var(--serif)}
.pack-meta{margin:.25rem 0 0;font-size:.85rem;color:var(--ink-soft)}
.items{list-style:disc;margin:0;padding:.9rem 1.1rem .9rem 2.2rem;flex:1}
.items li{padding:.3rem 0}
.items li::marker{color:var(--rose)}
.row{display:flex;align-items:center;gap:.75rem}
.thumb{position:relative;flex:none;width:44px;height:44px;border-radius:8px;background:var(--lilac);border:1px dashed var(--line);overflow:hidden}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.row .name{flex:1;min-width:0}
.row .amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.petal{margin:0 1.1rem .8rem;padding:.4rem .7rem;border-radius:8px;background:var(--lilac);font-size:.9rem;font-weight:600;color:var(--gold)}
.pack-foot{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.9rem 1.1rem;border-top:1px solid var(--line)}
.price{font:700 1.3rem/1 var(--serif)}
.add{padding:.55rem 1.1rem;border:0;border-radius:8px;background:var(--rose);color:#fff;font-weight:700}
.add:hover{background:var(--rose-dark)}
.add.added{background:var(--ink);color:var(--paper)}

/* cart drawer */
dialog.cart{margin:0 0 0 auto;width:min(100%,460px);height:100dvh;max-height:100dvh;padding:0;border:0;background:var(--paper);color:var(--ink);box-shadow:-8px 0 30px rgba(0,0,0,.25)}
dialog.cart::backdrop{background:rgba(20,10,30,.5)}
.cart-in{display:flex;flex-direction:column;height:100%}
.cart-top{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.25rem;border-bottom:1px solid var(--line)}
.cart-top h2{margin:0;font:700 1.35rem/1 var(--serif)}
.close{width:2.25rem;height:2.25rem;border:1px solid var(--line);border-radius:50%;background:transparent;color:var(--ink);font-size:1.2rem;line-height:1}
.cart-body{flex:1;overflow-y:auto;padding:1rem 1.25rem}
.cart-body h3{margin:1.5rem 0 .6rem;font:700 1.05rem/1.2 var(--serif)}
.cart-body h3:first-child{margin-top:0}
.line{display:flex;align-items:center;justify-content:space-between;gap:.75rem;padding:.7rem 0;border-bottom:1px solid var(--line)}
.line .t{min-width:0}
.line .t strong{display:block}
.line .t small{color:var(--ink-soft)}
.qty{display:flex;align-items:center;gap:.35rem}
.qty button{width:1.9rem;height:1.9rem;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);font-weight:700}
.qty span{min-width:1.5rem;text-align:center;font-variant-numeric:tabular-nums}
.line .lp{min-width:4.5rem;text-align:right;font-weight:700}
.remove{border:0;background:none;color:var(--ink-soft);text-decoration:underline;font-size:.85rem}
.get{list-style:none;margin:0;padding:0}
.get li{padding:.3rem 0}
.cart-foot{padding:1rem 1.25rem;border-top:1px solid var(--line);background:var(--card)}
.total{display:flex;justify-content:space-between;align-items:baseline;font:700 1.2rem/1.3 var(--serif)}
.clear{margin-top:.6rem;border:0;background:none;color:var(--ink-soft);text-decoration:underline}
.err{padding:2rem 1rem;color:var(--rose-dark)}
@media (prefers-reduced-motion:no-preference){
  dialog.cart[open]{animation:slide .22s ease-out}
  @keyframes slide{from{transform:translateX(100%)}to{transform:none}}
}
</style>
</head>
<body>

<header class="bar">
  <h1>Inikki Planner</h1>
  <button class="cart-btn" id="open-cart" type="button">View cart <span class="count" id="cart-count">0</span></button>
</header>

<nav class="tabs" id="tabs" role="tablist" aria-label="Collections"></nav>
<main id="main"><p class="empty">Loading packs…</p></main>

<dialog class="cart" id="cart" aria-labelledby="cart-title">
  <div class="cart-in">
    <div class="cart-top">
      <h2 id="cart-title">Your cart</h2>
      <button class="close" id="close-cart" type="button" aria-label="Close cart">✕</button>
    </div>
    <div class="cart-body" id="cart-body"></div>
    <div class="cart-foot" id="cart-foot"></div>
  </div>
</dialog>

<script>
const DATA_URL = 'data/packs.json';
const IMG_DIR  = 'images/items/';      // put item images here, named after the item (see slug())
const IMG_EXT  = 'png';
const STORE    = 'inikki-cart-v1';

let data = {};
let packs = {};                        // id -> pack (with its collection + section)
let cart  = {};                        // id -> quantity
let active = null;

try { cart = JSON.parse(localStorage.getItem(STORE)) || {}; } catch (e) { cart = {}; }

const $ = id => document.getElementById(id);
const save = () => { try { localStorage.setItem(STORE, JSON.stringify(cart)); } catch (e) {} };
const num = n => Number(n).toLocaleString();
const money = (n, cur) => {
  try { return new Intl.NumberFormat(undefined, { style: 'currency', currency: cur }).format(n); }
  catch (e) { return n.toFixed(2) + ' ' + cur; }
};
// "Momo's Cloak: Rose" -> "momo-s-cloak-rose"
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
const pretty = key => key.split('_').map((w, i) =>
  (i > 0 && ['and', 'of'].includes(w)) ? w : w.charAt(0).toUpperCase() + w.slice(1)).join(' ');

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

function thumb(name) {
  const t = el('span', 'thumb');
  t.setAttribute('aria-hidden', 'true');
  const img = new Image();
  img.alt = '';
  img.loading = 'lazy';
  img.src = IMG_DIR + slug(name) + '.' + IMG_EXT;
  img.onerror = () => img.remove();     // keep the placeholder box until the image exists
  t.appendChild(img);
  return t;
}

/* ---------- catalogue ---------- */
function renderTabs() {
  const tabs = $('tabs');
  tabs.innerHTML = '';
  Object.keys(data).forEach(key => {
    const b = el('button', 'tab', pretty(key));
    b.type = 'button';
    b.setAttribute('role', 'tab');
    b.setAttribute('aria-selected', key === active);
    b.onclick = () => { active = key; renderTabs(); renderMain(); };
    tabs.appendChild(b);
  });
}

function packCard(p) {
  const card = el('article', 'pack');
  const head = el('div', 'pack-head');
  head.appendChild(el('h3', '', p.pack_name));
  if (p.tier !== undefined) head.appendChild(el('p', 'pack-meta', 'Tier ' + p.tier));
  card.appendChild(head);

  const ul = el('ul', 'items');
  p.items_included.forEach((name, i) => {
    const amount = p.item_amount[i];
    const li = el('li');
    const row = el('div', 'row');
    row.appendChild(thumb(name));
    row.appendChild(el('span', 'name', name));
    row.appendChild(el('span', 'amt', amount === undefined ? '×?' : '×' + num(amount)));
    li.appendChild(row);
    ul.appendChild(li);
  });
  card.appendChild(ul);

  if (p.gives_petal_note) card.appendChild(el('p', 'petal', '+ ' + num(p.petal_note_amount) + ' Petal Notes'));

  const foot = el('div', 'pack-foot');
  foot.appendChild(el('span', 'price', money(p.price, p.currency_type)));
  const add = el('button', 'add', 'Add to cart');
  add.type = 'button';
  add.onclick = () => {
    cart[p.id] = (cart[p.id] || 0) + 1;
    save(); updateCount(); renderCart();
    add.textContent = 'Added (' + cart[p.id] + ')';
    add.classList.add('added');
    setTimeout(() => { add.textContent = 'Add to cart'; add.classList.remove('added'); }, 1200);
  };
  foot.appendChild(add);
  card.appendChild(foot);
  return card;
}

function renderMain() {
  const main = $('main');
  main.innerHTML = '';
  Object.entries(data[active] || {}).forEach(([section, list]) => {
    main.appendChild(el('h2', 'sub', section));
    if (!list.length) { main.appendChild(el('p', 'empty', 'No packs added yet.')); return; }
    const grid = el('div', 'grid');
    list.forEach(p => grid.appendChild(packCard(p)));
    main.appendChild(grid);
  });
}

/* ---------- cart ---------- */
function updateCount() {
  $('cart-count').textContent = Object.values(cart).reduce((a, b) => a + b, 0);
}

function setQty(id, q) {
  if (q <= 0) delete cart[id]; else cart[id] = q;
  save(); updateCount(); renderCart();
}

function renderCart() {
  const body = $('cart-body'), foot = $('cart-foot');
  body.innerHTML = ''; foot.innerHTML = '';
  const ids = Object.keys(cart).filter(id => packs[id]);

  if (!ids.length) {
    body.appendChild(el('p', 'empty', 'Your cart is empty. Add a pack to see what it costs and what you get.'));
    return;
  }

  body.appendChild(el('h3', '', 'Packs'));
  const totals = {}, gained = {}; let petals = 0;

  ids.forEach(id => {
    const p = packs[id], q = cart[id];
    totals[p.currency_type] = (totals[p.currency_type] || 0) + p.price * q;
    if (p.gives_petal_note) petals += p.petal_note_amount * q;
    p.items_included.forEach((name, i) => {
      const a = p.item_amount[i];
      if (a !== undefined) gained[name] = (gained[name] || 0) + a * q;
    });

    const line = el('div', 'line');
    const t = el('div', 't');
    t.appendChild(el('strong', '', p.pack_name));
    t.appendChild(el('small', '', money(p.price, p.currency_type) + ' each'));
    line.appendChild(t);

    const qty = el('div', 'qty');
    const minus = el('button', '', '−'); minus.type = 'button'; minus.setAttribute('aria-label', 'Remove one ' + p.pack_name);
    minus.onclick = () => setQty(id, q - 1);
    const plus = el('button', '', '+'); plus.type = 'button'; plus.setAttribute('aria-label', 'Add one ' + p.pack_name);
    plus.onclick = () => setQty(id, q + 1);
    qty.append(minus, el('span', '', q), plus);
    line.appendChild(qty);
    line.appendChild(el('span', 'lp', money(p.price * q, p.currency_type)));
    body.appendChild(line);
  });

  body.appendChild(el('h3', '', "What you'll get"));
  const ul = el('ul', 'get');
  Object.entries(gained).forEach(([name, amt]) => {
    const li = el('li'), row = el('div', 'row');
    row.append(thumb(name), el('span', 'name', name), el('span', 'amt', '×' + num(amt)));
    li.appendChild(row); ul.appendChild(li);
  });
  if (petals) {
    const li = el('li'), row = el('div', 'row');
    row.append(el('span', 'thumb'), el('span', 'name', 'Petal Notes'), el('span', 'amt', '×' + num(petals)));
    li.appendChild(row); ul.appendChild(li);
  }
  body.appendChild(ul);

  Object.entries(totals).forEach(([cur, sum]) => {
    const r = el('div', 'total');
    r.append(el('span', '', ids.length && Object.keys(totals).length > 1 ? 'Total (' + cur + ')' : 'Total'), el('span', '', money(sum, cur)));
    foot.appendChild(r);
  });
  const clear = el('button', 'clear', 'Empty cart');
  clear.type = 'button';
  clear.onclick = () => { cart = {}; save(); updateCount(); renderCart(); };
  foot.appendChild(clear);
}

const dlg = $('cart');
$('open-cart').onclick = () => { renderCart(); dlg.showModal(); };
$('close-cart').onclick = () => dlg.close();
dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });

/* ---------- load ---------- */
fetch(DATA_URL)
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(json => {
    data = json;
    Object.entries(data).forEach(([col, sections]) =>
      Object.entries(sections).forEach(([sec, list]) =>
        list.forEach(p => { packs[p.id] = p; })));
    active = Object.keys(data)[0];
    renderTabs(); renderMain(); updateCount();
  })
  .catch(err => {
    $('main').innerHTML = '';
    $('main').appendChild(el('p', 'err', 'Could not load ' + DATA_URL + ' (' + err.message + '). If you opened this file directly, run it through a local server or GitHub Pages instead.'));
  });
</script>
</body>
</html>
