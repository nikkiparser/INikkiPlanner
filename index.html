<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinity Nikki - Unofficial Spending Planner</title>
    <!-- Elegant, modern Google Fonts -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #f6f0ea 0%, #f1e4e9 50%, #e3ebf5 100%);
            --card-bg: rgba(255, 255, 255, 0.75);
            --primary: #9b72aa;
            --primary-light: #c299d0;
            --accent-gold: #dfb15b;
            --text-dark: #4a3e4d;
            --text-muted: #7d6e80;
            --border-radius: 16px;
            --shadow: 0 8px 32px 0 rgba(155, 114, 170, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-dark);
            min-height: 100vh;
            padding: 2rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 1000px;
            width: 100%;
        }

        header {
            text-align: center;
            margin-bottom: 3rem;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.8rem;
            color: var(--primary);
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        /* Dashboard Grid Layout */
        .dashboard {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
        }

        @media (min-width: 768px) {
            .dashboard {
                grid-template-columns: 1fr 2fr;
            }
        }

        /* Card Styling */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: var(--border-radius);
            padding: 2rem;
            box-shadow: var(--shadow);
        }

        .card h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem;
            color: var(--primary);
            margin-bottom: 1.5rem;
            border-bottom: 2px solid rgba(155, 114, 170, 0.1);
            padding-bottom: 0.5rem;
        }

        /* Input Styling */
        .input-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: var(--text-dark);
        }

        input, select {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 1px solid rgba(155, 114, 170, 0.2);
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.9);
            font-family: inherit;
            color: var(--text-dark);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(155, 114, 170, 0.1);
        }

        /* Button Styling */
        button {
            width: 100%;
            padding: 0.9rem;
            background: linear-gradient(135deg, var(--primary) 0%, #b185bf 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(155, 114, 170, 0.2);
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        button:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }

        /* Result Overview Layout */
        .results-summary {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .stat-box {
            background: rgba(255, 255, 255, 0.5);
            padding: 1rem;
            border-radius: 8px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .stat-box span {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-box strong {
            font-size: 1.3rem;
            color: var(--primary);
        }

        .stat-box.highlight strong {
            color: var(--accent-gold);
        }

        /* Wishlist Item Table/List */
        .wishlist-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .wishlist-items {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            max-height: 500px;
            overflow-y: auto;
            padding-right: 0.25rem;
        }

        .item-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.6);
            padding: 1rem;
            border-radius: 10px;
            border-left: 4px solid var(--primary-light);
            animation: fadeIn 0.3s ease;
        }

        .item-card.tier-6 {
            border-left-color: var(--accent-gold);
        }

        .item-details h4 {
            font-size: 1rem;
            font-weight: 500;
        }

        .item-details p {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .item-cost {
            text-align: right;
        }

        .item-cost .pulls {
            font-weight: 600;
            color: var(--primary);
        }

        .delete-btn {
            background: none;
            box-shadow: none;
            color: var(--text-muted);
            padding: 0.25rem 0.5rem;
            width: auto;
            font-size: 0.85rem;
            margin-left: 1rem;
        }

        .delete-btn:hover {
            color: #d9534f;
            background: none;
            transform: none;
        }

        /* Footer Disclaimer */
        footer {
            margin-top: 5rem;
            text-align: center;
            max-width: 700px;
            width: 100%;
        }

        footer p {
            font-size: 0.75rem;
            color: var(--text-muted);
            line-height: 1.5;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Miracle Studio Planner</h1>
            <p>An Unofficial Gacha Budget & Wishlist Calculator</p>
        </header>

        <div class="dashboard">
            <!-- Left Side: Stash & Calculations -->
            <div class="sidebar-layout">
                <div class="card">
                    <h2>Your Current Stash</h2>
                    <div class="input-group">
                        <label for="current-crystals">Saved Resonice/Stellarites</label>
                        <input type="number" id="current-crystals" value="0" min="0" oninput="calculateBudget()">
                    </div>
                    <div class="input-group">
                        <label for="current-pulls">Current Starconch Pity Count</label>
                        <input type="number" id="current-pulls" value="0" min="0" max="89" oninput="calculateBudget()">
                    </div>
                    <div class="input-group">
                        <label for="calculation-mode">Calculation Strategy</label>
                        <select id="calculation-mode" onchange="calculateBudget()">
                            <option value="average">Average Luck (70 Pulls/Outfit)</option>
                            <option value="worst">Worst Case / Hard Pity (90 Pulls)</option>
                        </select>
                    </div>

                    <div class="results-summary">
                        <div class="stat-box">
                            <span>Total Pulls Needed</span>
                            <strong id="total-pulls-needed">0</strong>
                        </div>
                        <div class="stat-box highlight">
                            <span>Shortfall (Pulls)</span>
                            <strong id="shortfall-pulls">0</strong>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Side: Wishlist Target Builder -->
            <div class="main-layout">
                <div class="card">
                    <div class="wishlist-header">
                        <h2>Your Outfits Wishlist</h2>
                    </div>

                    <!-- Add Item Form Inline -->
                    <div style="display: grid; grid-template-columns: 2fr 1fr auto; gap: 0.5rem; margin-bottom: 1.5rem;">
                        <input type="text" id="new-item-name" placeholder="Outfit Name (e.g., At Dreams' Dawn)">
                        <select id="new-item-tier">
                            <option value="6">6-Star (Splendor)</option>
                            <option value="5">5-Star</option>
                        </select>
